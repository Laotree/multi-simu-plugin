[package]
name = "multi-simu"
version = "0.1.0"
edition = "2021"
description = "Show and drive iOS simulators, Android emulators and web pages inside any terminal."
license = "MIT OR Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/Laotree/multi-simu-plugin"
homepage = "https://github.com/Laotree/multi-simu-plugin"
readme = "README.md"
keywords = ["simulator", "emulator", "terminal", "ios", "android"]
categories = ["development-tools", "command-line-utilities"]
exclude = ["tools/ios-probe", "examples/local.toml"]

[[bin]]
name = "multi-simu"
path = "src/main.rs"

[features]
default = ["ios"]
ios = ["dep:objc2", "dep:objc2-foundation"]

[dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true }
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
crossterm = "0.29"
base64 = "0.22"
flate2 = "1.1"
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"

[build-dependencies]
tonic-prost-build = "0.14"

[profile.release]
lto = "thin"
strip = true
